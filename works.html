<!DOCTYPE html>
<html lang="ko">

<body>

  <!-- 1. 왼쪽 고정 메뉴 영역 -->

    <div>
      <h1 class="artist-name">Jung HyunJun</h1>
      <p class="artist-bio">Digital & Kinetic Art</p>
    </div>
    
    <nav class="menu">
      <a href="index.html">Home</a>
      <a href="works.html" class="active">Works</a>
      <a href="about.html">About</a>

      <!-- 1-2 -->

    </div>

    <!-- 2번 열 -->

        <div class="media-box">
          <img src="assets/work3.jpg" alt="Work 03">
          <div class="work-overlay">
